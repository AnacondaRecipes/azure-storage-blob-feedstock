{% set name = "azure-storage-blob" %}
{% set version = "12.27.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/a/azure-storage-blob/azure_storage_blob-12.27.1.tar.gz
  sha256: a1596cc4daf5dac9be115fcb5db67245eae894cf40e4248243754261f7b674a6

build:
  number: 0
  skip: true  # [py<39]
  script: {{ PYTHON }} -m pip install . --no-deps -vv --no-build-isolation

requirements:
  host:
    - python
    - pip
    - setuptools
    - wheel
  run:
    - python
    - azure-core >=1.30.0
    - cryptography >=2.1.4
    - typing-extensions >=4.3.0
    - isodate >=0.6.1
    - typing_extensions >=4.6.0

test:
  imports:
    - azure.storage.blob
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://pypi.org/project/azure-storage-blob/
  summary: Microsoft Azure Blob Storage Client Library for Python
  description: Azure Blob storage is Microsoft's object storage solution for the cloud. Blob storage is optimized for storing massive amounts of unstructured data, such as text or binary data.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: https://github.com/Azure/azure-sdk-for-python/tree/main/sdk/storage/azure-storage-blob/azure/storage/blob
  doc_url: https://learn.microsoft.com/en-us/python/api/azure-storage-blob/?view=azure-python

extra:
  recipe-maintainers:
    - xhochy
