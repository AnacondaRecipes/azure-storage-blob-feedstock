{% set name = "azure-storage-blob" %}
{% set version = "12.28.0b1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_')}}-{{ version }}.tar.gz
  sha256: 76fcb4e91c8f0f36678534b35c9b22795266f1426572307812d04d1abc868fd8

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps -vv --no-build-isolation
  skip: true  # [py<39]

requirements:
  host:
    - python
    - pip
    - setuptools
    - wheel
  run:
    - python
    - azure-core >=1.30.0
    - cryptography >=2.1.4
    - typing_extensions >=4.6.0
    - isodate >=0.6.1
  run_constrained:
    # azure-core[aio]>=1.30.0 -> https://github.com/Azure/azure-sdk-for-python/blob/main/sdk/core/azure-core/pyproject.toml#L32
    - aiohttp >=3.0

# To run these tests you need to have devtools_testutils package which is a part of azure-sdk repository
test:
  imports:
    - azure.storage.blob
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://pypi.org/project/azure-storage-blob
  summary: Microsoft Azure Blob Storage Client Library for Python
  description: |
    Azure Blob storage is Microsoft's object storage solution for the cloud.
    Blob storage is optimized for storing massive amounts of unstructured data, such as text or binary data.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: https://github.com/Azure/azure-sdk-for-python/tree/main/sdk/storage/azure-storage-blob/azure/storage/blob
  doc_url: https://learn.microsoft.com/en-us/python/api/azure-storage-blob/?view=azure-python

extra:
  recipe-maintainers:
    - xhochy
